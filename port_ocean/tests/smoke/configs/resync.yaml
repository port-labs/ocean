# Polling resync smoke. Tests mark themselves with smoke_config("resync").
wait_for_resync: true
ocean:
  event_listener:
    type: POLLING
    resync_on_start: true
    interval: 3600
  actions_processor:
    enabled: false
  live_events:
    is_redis_stream_consumer_enabled: false
  integration:
    config:
      entity_amount: -1
      entity_kb_size: -1
      third_party_batch_size: -1
      third_party_latency_ms: -1
