# Actions/workflows smoke. Tests mark themselves with smoke_configset("actions").
# Daemon-style POLLING; wait_for_resync defaults to true before pytest.
ocean:
  event_listener:
    type: POLLING
    resync_on_start: true
    interval: 3600
  actions_processor:
    enabled: true
  live_events:
    is_redis_stream_consumer_enabled: true
  integration:
    config:
      entity_amount: 1
      entity_kb_size: 1
      third_party_batch_size: 1000
      third_party_latency_ms: 0
