createMissingRelatedEntities: true
deleteDependentEntities: true
resources:
  - kind: team
    selector:
      query: "true"
    port:
      entity:
        mappings:
          identifier: .key
          title: .name
          blueprint: '"linearTeam"'
          properties:
            description: .description
            workspaceName: .organization.name
            url: "\"https://linear.app/\" + .organization.urlKey + \"/team/\" + .key"
  - kind: label
    selector:
      query: "true"
    port:
      entity:
        mappings:
          identifier: .id
          title: .name
          blueprint: '"linearLabel"'
          properties:
            isGroup: .isGroup
          relations:
            parentLabel: .parent.id
            childLabels: "[.children.edges[].node.id]"
  - kind: issue
    selector:
      query: "true"
    port:
      entity:
        mappings:
          identifier: .identifier
          title: .title
          blueprint: '"linearIssue"'
          properties:
            url: .url
            status: .state.name
            assignee: .assignee.email
            creator: .creator.email
            priority: .priorityLabel
            created: .createdAt
            updated: .updatedAt
          relations:
            team: .team.key
            labels: .labelIds
            parentIssue: .parent.identifier
  - kind: document
    selector:
      query: "true"
    port:
      entity:
        mappings:
          identifier: .id
          title: .title
          blueprint: '"linearDocument"'
          properties:
            url: .url
            summary: .summary
            content: .content
            slugId: .slugId
            parentType: 'if .project then "project" elif .issue then "issue" elif .team then "team" elif .initiative then "initiative" elif .cycle then "cycle" elif .release then "release" else null end'
            project: .project.name
            initiative: .initiative.name
            cycle: .cycle.number
            creator: .creator.email
            owner: .owner.email
            created: .createdAt
            updated: .updatedAt
          relations:
            team: .team.key
            issue: .issue.identifier
  - kind: user
    selector:
      query: "true"
    port:
      entity:
        mappings:
          identifier: .id
          title: .displayName // .name
          blueprint: '"linearUser"'
          properties:
            name: .name
            email: .email
            url: .url
            title: .title
            active: .active
            admin: .admin
            guest: .guest
            created: .createdAt
            updated: .updatedAt
  - kind: project
    selector:
      query: "true"
    port:
      entity:
        mappings:
          identifier: .id
          title: .name
          blueprint: '"linearProject"'
          properties:
            url: .url
            description: .description
            status: .status.name
            health: .health
            progress: .progress
            priority: .priorityLabel
            startDate: .startDate
            targetDate: .targetDate
            lead: .lead.email
            created: .createdAt
            updated: .updatedAt
          relations:
            teams: "[.teams.nodes[].key]"
            leadUser: .lead.id
  - kind: team-members
    selector:
      query: "true"
    port:
      entity:
        mappings:
          identifier: .id
          title: .user.displayName // .user.name
          blueprint: '"linearTeamMember"'
          properties:
            email: .user.email
            isOwner: .owner
            created: .createdAt
            updated: .updatedAt
          relations:
            team: .team.key
            user: .user.id
  - kind: cycle
    selector:
      query: "true"
    port:
      entity:
        mappings:
          identifier: .id
          title: if .name then .name else "Cycle " + (.number | tostring)
          blueprint: '"linearCycle"'
          properties:
            number: .number
            description: .description
            progress: .progress
            startsAt: .startsAt
            endsAt: .endsAt
            completedAt: .completedAt
            isActive: .isActive
            isFuture: .isFuture
            isPast: .isPast
            created: .createdAt
            updated: .updatedAt
          relations:
            team: .team.key
