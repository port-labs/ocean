resources:
  - kind: subscription
    selector:
      query: 'true'
      apiVersion: '2022-09-01'
    port:
      entity:
        mappings:
          identifier: .id
          title: .display_name
          blueprint: '"azureSubscription"'
          properties:
            tags: .tags // {}
  - kind: Microsoft.Resources/resourceGroups
    selector:
      query: 'true'
      apiVersion: '2022-09-01'
    port:
      entity:
        mappings:
          identifier: >-
            .id | split("/") | .[3] |= ascii_downcase |.[4] |= ascii_downcase |
            join("/")
          title: .name
          blueprint: '"azureResourceGroup"'
          properties:
            location: .location
            provisioningState: .properties.provisioningState + .properties.provisioning_state
            tags: .tags // {}
          relations:
            subscription: >-
              .id | split("/") | .[1] |= ascii_downcase |.[2] |= ascii_downcase
              | .[:3] |join("/")
  - kind: Microsoft.App/containerApps
    selector:
      query: 'true'
      apiVersion: '2022-03-01'
    port:
      entity:
        mappings:
          identifier: >-
            .id | split("/") | .[3] |= ascii_downcase |.[4] |= ascii_downcase |
            join("/")
          title: .name
          blueprint: '"azureCloudResource"'
          properties:
            location: .location
            type: .type
            tags: .tags // {}
          relations:
            resource_group: >-
              .id | split("/") | .[3] |= ascii_downcase |.[4] |= ascii_downcase
              | .[:5] |join("/")
  - kind: Microsoft.Storage/storageAccounts
    selector:
      query: 'true'
      apiVersion: '2023-01-01'
    port:
      entity:
        mappings:
          identifier: >-
            .id | split("/") | .[3] |= ascii_downcase |.[4] |= ascii_downcase |
            join("/")
          title: .name
          blueprint: '"azureCloudResource"'
          properties:
            location: .location
            type: .type
            tags: .tags // {}
          relations:
            resource_group: >-
              .id | split("/") | .[3] |= ascii_downcase |.[4] |= ascii_downcase
              | .[:5] |join("/")
  - kind: Microsoft.Compute/virtualMachines
    selector:
      query: 'true'
      apiVersion: '2023-03-01'
    port:
      entity:
        mappings:
          identifier: >-
            .id | split("/") | .[3] |= ascii_downcase |.[4] |= ascii_downcase |
            join("/")
          title: .name
          blueprint: '"azureCloudResource"'
          properties:
            location: .location
            type: .type
            tags: .tags // {}
          relations:
            resource_group: >-
              .id | split("/") | .[3] |= ascii_downcase |.[4] |= ascii_downcase
              | .[:5] |join("/")
  - kind: Microsoft.ContainerService/managedClusters
    selector:
      query: 'true'
      apiVersion: '2023-05-01'
    port:
      entity:
        mappings:
          identifier: >-
            .id | split("/") | .[3] |= ascii_downcase |.[4] |= ascii_downcase |
            join("/")
          title: .name
          blueprint: '"azureCloudResource"'
          properties:
            location: .location
            type: .type
            tags: .tags // {}
          relations:
            resource_group: >-
              .id | split("/") | .[3] |= ascii_downcase |.[4] |= ascii_downcase
              | .[:5] |join("/")
  - kind: Microsoft.Network/loadBalancers
    selector:
      query: 'true'
      apiVersion: '2023-02-01'
    port:
      entity:
        mappings:
          identifier: >-
            .id | split("/") | .[3] |= ascii_downcase |.[4] |= ascii_downcase |
            join("/")
          title: .name
          blueprint: '"azureCloudResource"'
          properties:
            location: .location
            type: .type
            tags: .tags // {}
          relations:
            resource_group: >-
              .id | split("/") | .[3] |= ascii_downcase |.[4] |= ascii_downcase
              | .[:5] |join("/")
  - kind: Microsoft.CognitiveServices/accounts/projects
    selector:
      query: 'true'
      apiVersion: '2025-06-01'
    port:
      entity:
        mappings:
          identifier: .id
          title: .name
          blueprint: '"foundry_project"'
          properties:
            endpoint: .__foundryProjectEndpoint
            accountName: .accountName
            subscriptionId: .subscriptionId
            resourceGroupName: .resourceGroupName
            location: .location
            tags: .tags // {}
          relations:
            subscription: >-
              "/subscriptions/" + (.subscriptionId | ascii_downcase)
  - kind: foundry-agent
    selector:
      query: 'true'
      project:
        apiVersion: '2025-06-01'
    port:
      entity:
        mappings:
          identifier: (.id // .name | tostring)
          title: .name // .id
          blueprint: '"foundry_agent"'
          properties:
            kind: .versions.latest.definition.kind
            model: .versions.latest.definition.model
            instructions: .versions.latest.definition.instructions
            description: .versions.latest.description
            status: .status // .state
            configurationState: .configuration_state // .configurationState
            version: (.versions.latest.version | tostring)
            versionStatus: .versions.latest.status
            agentGuid: (.versions.latest.agent_guid // .versions.latest.agentGuid | tostring)
            toolCount: ((.versions.latest.definition.tools // []) | length)
            tools: .versions.latest.definition.tools
            metadata: .metadata
            entraPrincipalId: >-
              (.versions.latest.instance_identity.principal_id
              // .versions.latest.instance_identity.principalId
              // .versions.latest.instanceIdentity.principal_id
              // .versions.latest.instanceIdentity.principalId | tostring)
            entraClientId: >-
              (.versions.latest.instance_identity.client_id
              // .versions.latest.instance_identity.clientId
              // .versions.latest.instanceIdentity.client_id
              // .versions.latest.instanceIdentity.clientId | tostring)
            identityBlueprintId: >-
              (.versions.latest.blueprint_reference.blueprint_id
              // .versions.latest.blueprint_reference.blueprintId
              // .versions.latest.blueprintReference.blueprint_id
              // .versions.latest.blueprintReference.blueprintId | tostring)
            createdAt: >-
              (.versions.latest.created_at // .versions.latest.createdAt // .created_at // .createdAt) as $t
              | if $t == null then null
                elif ($t | type) == "number" then ($t | todate)
                elif ($t | tostring | test("^[0-9]+$")) then ($t | tonumber | todate)
                else $t end
          relations:
            modelDeployment: .versions.latest.definition.model
            foundryProject: .__foundryProjectId
  - kind: foundry-agent
    selector:
      query: 'true'
      includeVersions: true
      project:
        apiVersion: '2025-06-01'
    port:
      itemsToParse: .versions // []
      entity:
        mappings:
          identifier: (.item.id | tostring)
          title: .item.id
          blueprint: '"foundry_agent_version"'
          properties:
            agentId: .item.agent_id
            version: (.item.version // .item.id | tostring)
            kind: .item.definition.kind
            model: .item.definition.model
            instructions: .item.definition.instructions
            description: .item.description
            versionStatus: .item.status
            isDraft: .item.draft
            metadata: .item.metadata
            tools: .item.definition.tools
            toolCount: ((.item.definition.tools // []) | length)
            entraPrincipalId: >-
              (.item.instance_identity.principal_id
              // .item.instance_identity.principalId
              // .item.instanceIdentity.principal_id
              // .item.instanceIdentity.principalId | tostring)
            entraClientId: >-
              (.item.instance_identity.client_id
              // .item.instance_identity.clientId
              // .item.instanceIdentity.client_id
              // .item.instanceIdentity.clientId | tostring)
            createdAt: >-
              (.item.created_at // .item.createdAt) as $t
              | if $t == null then null
                elif ($t | type) == "number" then ($t | todate)
                elif ($t | tostring | test("^[0-9]+$")) then ($t | tonumber | todate)
                else $t end
          relations:
            agent: (.item.agent_id | tostring)
  - kind: foundry-model-deployment
    selector:
      query: 'true'
      project:
        apiVersion: '2025-06-01'
    port:
      entity:
        mappings:
          identifier: (.id // .name | tostring)
          title: .name // .id
          blueprint: '"foundry_model_deployment"'
          properties:
            model: .model // .modelName
            modelVersion: .modelVersion // .model_version
            modelPublisher: .modelPublisher // .model_publisher
            deploymentType: .type // .deploymentType // .deployment_type
            sku: (.sku.name // .sku)
            capabilities: .capabilities
          relations:
            foundryProject: .__foundryProjectId
  - kind: foundry-conversation
    selector:
      query: 'true'
      sinceDays: 30
      project:
        apiVersion: '2025-06-01'
    port:
      entity:
        mappings:
          identifier: (.id | tostring)
          title: .id
          blueprint: '"foundry_conversation"'
          properties:
            createdAt: >-
              (.created_at // .createdAt) as $t
              | if $t == null then null
                elif ($t | type) == "number" then ($t | todate)
                elif ($t | tostring | test("^[0-9]+$")) then ($t | tonumber | todate)
                else $t end
            metadata: .metadata
            promptTokens: (.prompt_tokens // 0)
            completionTokens: (.completion_tokens // 0)
            totalTokens: (.total_tokens // 0)
            toolCallCount: (.tool_call_count // 0)
          relations:
            agents: (.participant_agent_ids // [])
            modelDeployments: (.participant_model_deployment_ids // [])
            foundryProject: .__foundryProjectId
  - kind: foundry-response
    selector:
      query: 'true'
      sinceDays: 30
      project:
        apiVersion: '2025-06-01'
    port:
      entity:
        mappings:
          identifier: (.id | tostring)
          title: .id
          blueprint: '"foundry_response"'
          properties:
            status: .status
            createdAt: >-
              (.created_at // .createdAt) as $t
              | if $t == null then null
                elif ($t | type) == "number" then ($t | todate)
                elif ($t | tostring | test("^[0-9]+$")) then ($t | tonumber | todate)
                else $t end
            promptTokens: (.usage.prompt_tokens // .usage.input_tokens // .prompt_tokens)
            completionTokens: (.usage.completion_tokens // .usage.output_tokens // .completion_tokens)
            totalTokens: (.usage.total_tokens // .total_tokens)
          relations:
            conversation: >-
              (.conversation_id // .conversationId // .conversation.id // .conversation | tostring)
            modelDeployment: (.model_deployment_id // .model | tostring)
  - kind: foundry-memory-store
    selector:
      query: 'true'
      project:
        apiVersion: '2025-06-01'
    port:
      entity:
        mappings:
          identifier: (.id // .name | tostring)
          title: .name // .id
          blueprint: '"foundry_memory_store"'
          properties:
            name: .name
            description: .description
            createdAt: >-
              (.created_at // .createdAt) as $t
              | if $t == null then null
                elif ($t | type) == "number" then ($t | todate)
                elif ($t | tostring | test("^[0-9]+$")) then ($t | tonumber | todate)
                else $t end
            metadata: .metadata
          relations:
            foundryProject: .__foundryProjectId
