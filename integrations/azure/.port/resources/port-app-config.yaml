resources:
  - kind: subscription
    selector:
      query: 'true'
      apiVersion: '2022-09-01'
    port:
      entity:
        mappings:
          identifier: .id
          title: .display_name
          blueprint: '"azureSubscription"'
          properties:
            tags: .tags // {}
  - kind: Microsoft.Resources/resourceGroups
    selector:
      query: 'true'
      apiVersion: '2022-09-01'
    port:
      entity:
        mappings:
          identifier: >-
            .id | split("/") | .[3] |= ascii_downcase |.[4] |= ascii_downcase |
            join("/")
          title: .name
          blueprint: '"azureResourceGroup"'
          properties:
            location: .location
            provisioningState: .properties.provisioningState + .properties.provisioning_state
            tags: .tags // {}
          relations:
            subscription: >-
              .id | split("/") | .[1] |= ascii_downcase |.[2] |= ascii_downcase
              | .[:3] |join("/")
  - kind: Microsoft.App/containerApps
    selector:
      query: 'true'
      apiVersion: '2022-03-01'
    port:
      entity:
        mappings:
          identifier: >-
            .id | split("/") | .[3] |= ascii_downcase |.[4] |= ascii_downcase |
            join("/")
          title: .name
          blueprint: '"azureCloudResource"'
          properties:
            location: .location
            type: .type
            tags: .tags // {}
          relations:
            resource_group: >-
              .id | split("/") | .[3] |= ascii_downcase |.[4] |= ascii_downcase
              | .[:5] |join("/")
  - kind: Microsoft.Storage/storageAccounts
    selector:
      query: 'true'
      apiVersion: '2023-01-01'
    port:
      entity:
        mappings:
          identifier: >-
            .id | split("/") | .[3] |= ascii_downcase |.[4] |= ascii_downcase |
            join("/")
          title: .name
          blueprint: '"azureCloudResource"'
          properties:
            location: .location
            type: .type
            tags: .tags // {}
          relations:
            resource_group: >-
              .id | split("/") | .[3] |= ascii_downcase |.[4] |= ascii_downcase
              | .[:5] |join("/")
  - kind: Microsoft.Compute/virtualMachines
    selector:
      query: 'true'
      apiVersion: '2023-03-01'
    port:
      entity:
        mappings:
          identifier: >-
            .id | split("/") | .[3] |= ascii_downcase |.[4] |= ascii_downcase |
            join("/")
          title: .name
          blueprint: '"azureCloudResource"'
          properties:
            location: .location
            type: .type
            tags: .tags // {}
          relations:
            resource_group: >-
              .id | split("/") | .[3] |= ascii_downcase |.[4] |= ascii_downcase
              | .[:5] |join("/")
  - kind: Microsoft.ContainerService/managedClusters
    selector:
      query: 'true'
      apiVersion: '2023-05-01'
    port:
      entity:
        mappings:
          identifier: >-
            .id | split("/") | .[3] |= ascii_downcase |.[4] |= ascii_downcase |
            join("/")
          title: .name
          blueprint: '"azureCloudResource"'
          properties:
            location: .location
            type: .type
            tags: .tags // {}
          relations:
            resource_group: >-
              .id | split("/") | .[3] |= ascii_downcase |.[4] |= ascii_downcase
              | .[:5] |join("/")
  - kind: Microsoft.Network/loadBalancers
    selector:
      query: 'true'
      apiVersion: '2023-02-01'
    port:
      entity:
        mappings:
          identifier: >-
            .id | split("/") | .[3] |= ascii_downcase |.[4] |= ascii_downcase |
            join("/")
          title: .name
          blueprint: '"azureCloudResource"'
          properties:
            location: .location
            type: .type
            tags: .tags // {}
          relations:
            resource_group: >-
              .id | split("/") | .[3] |= ascii_downcase |.[4] |= ascii_downcase
              | .[:5] |join("/")
  - kind: Microsoft.CognitiveServices/accounts/projects
    selector:
      query: 'true'
      apiVersion: '2025-06-01'
    port:
      entity:
        mappings:
          identifier: .id
          title: .name
          blueprint: '"foundry_project"'
          properties:
            endpoint: .__foundryProjectEndpoint
            accountName: .accountName
            subscriptionId: .subscriptionId
            resourceGroupName: .resourceGroupName
            location: .location
            tags: .tags // {}
          relations:
            subscription: >-
              "/subscriptions/" + (.subscriptionId | ascii_downcase)
  - kind: foundry-agent
    selector:
      query: 'true'
      project:
        apiVersion: '2025-06-01'
    port:
      entity:
        mappings:
          identifier: .id
          title: .name
          blueprint: '"foundry_agent"'
          properties:
            kind: .versions.latest.definition.kind
            model: .versions.latest.definition.model
            instructions: .versions.latest.definition.instructions
            description: .versions.latest.description
            status: .state
            configurationState: .configuration_state
            version: .versions.latest.version
            versionStatus: .versions.latest.status
            agentGuid: .versions.latest.agent_guid
            toolCount: ((.versions.latest.definition.tools // []) | length)
            tools: .versions.latest.definition.tools
            metadata: .versions.latest.metadata
            entraPrincipalId: .versions.latest.instance_identity.principal_id
            entraClientId: .versions.latest.instance_identity.client_id
            identityBlueprintId: .versions.latest.blueprint_reference.blueprint_id
            createdAt: .versions.latest.created_at
          relations:
            modelDeployment: .__foundryProjectName + "/" + .versions.latest.definition.model
            foundryProject: .__foundryProjectId
  - kind: foundry-model-deployment
    selector:
      query: 'true'
      project:
        apiVersion: '2025-06-01'
    port:
      entity:
        mappings:
          identifier: .__foundryProjectName + "/" + .name
          title: .name
          blueprint: '"foundry_model_deployment"'
          properties:
            model: .modelName
            modelVersion: .modelVersion
            modelPublisher: .modelPublisher
            deploymentType: .type
            sku: .sku.name
            capabilities: .capabilities
          relations:
            foundryProject: .__foundryProjectId
  - kind: foundry-conversation
    selector:
      query: 'true'
      sinceDays: 30
      project:
        apiVersion: '2025-06-01'
    port:
      entity:
        mappings:
          identifier: .id
          title: .id
          blueprint: '"foundry_conversation"'
          properties:
            createdAt: .created_at
            metadata: .metadata
          relations:
            foundryProject: .__foundryProjectId
  - kind: foundry-response
    selector:
      query: 'true'
      sinceDays: 30
      project:
        apiVersion: '2025-06-01'
    port:
      entity:
        mappings:
          identifier: .id
          title: .id
          blueprint: '"foundry_response"'
          properties:
            status: .status
            createdAt: .created_at
            promptTokens: .usage.input_tokens
            completionTokens: .usage.output_tokens
            totalTokens: .usage.total_tokens
            cachedTokens: .usage.input_token_details.cached_tokens // 0
            reasoningTokens: .usage.output_token_details.reasoning_tokens // 0
            toolCalls: >-
              ([.output[]? | select((.type // "") | endswith("_call"))] // [])
          relations:
            conversation: .conversation.id
  - kind: foundry-memory-store
    selector:
      query: 'true'
      project:
        apiVersion: '2025-06-01'
    port:
      entity:
        mappings:
          identifier: .id
          title: .name
          blueprint: '"foundry_memory_store"'
          properties:
            name: .name
            description: .description
            createdAt: .created_at
            metadata: .metadata
          relations:
            foundryProject: .__foundryProjectId
