changelog: Fold Azure AI Foundry into the Azure integration with multi-subscription project auto-discovery, Foundry catalog kinds, actions, incremental sync, and response webhooks (existing azure-ai-foundry installations must be reinstalled as azure). Enable Port-hosted (SaaS) installation; live events remain self-hosted via Event Grid / Terraform. Rename Foundry Ocean kinds — ARM project uses Microsoft.CognitiveServices/accounts/projects; data-plane kinds use foundry-* prefix. Fix Foundry project data-plane URLs to use services.ai.azure.com and the correct project path segment. Default tag mappings use `.tags // {}` so null Azure tags do not warn during transform.
