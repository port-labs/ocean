changelog: Added incremental sync for GitHub tags, branches and plugins, scanning only repositories pushed since the last cursor (creating, updating or deleting a tag or branch updates the repository's pushed_at); all tags, branches (including detail and protection enrichment) and plugin detection for those repositories are unchanged. Fixed incremental repository, tag, branch, workflow and plugin syncs that use the Search API missing recently changed repositories, by finding changed repositories from the live repository list (sorted by updated_at or pushed_at) instead of the search index, which can report changes late, and using search only to match them against the repoSearch query
