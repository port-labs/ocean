changelog: Added incremental sync for GitHub tags, branches and plugins. An incremental run only processes repositories pushed since the last cursor (creating, updating or deleting a tag or branch updates the repository's pushed_at) and fetches everything in them exactly as a full resync does. With repoSearch, the search's pushed qualifier reaches 10 minutes back before the cursor, so a push the search index shows late is found on the next run. Branch protection rule changes are not pushes, so they are updated on the next full resync.
