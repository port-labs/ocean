changelog: Added incremental sync for GitHub tags, branches and plugins. An incremental run only processes repositories pushed since the last cursor (creating, updating or deleting a tag or branch updates the repository's pushed_at) and fetches everything in them exactly as a full resync does. Pushed repositories are taken from the live repository list rather than the search index, which reports pushes late, and repoSearch is only used to keep the pushed repositories that match the query; workflows' incremental sync uses the same lookup. Branch mappings with protectionRules enabled fetch every repository on incremental runs, since protection changes are not pushes.
