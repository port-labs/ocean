changelog: Add incremental sync for files, folders, skills, plugins, and MCP. Incremental runs only scan repositories pushed since the cursor (sorted by push time with early stop, or a `pushed:>=` search qualifier when `repoSearch` is set). File and skill syncs diff each branch against its last commit before the cursor and fetch only matching changes; folders and plugins reuse shared repository selection. Deleted entities are removed on the next full resync (or by push webhook for skills).
