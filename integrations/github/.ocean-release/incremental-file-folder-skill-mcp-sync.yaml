changelog: Added incremental sync for GitHub file, folder, skill and mcp kinds. An incremental run only reads repositories pushed since the last cursor, and for each one compares the branch tip at the cursor (taken from the repository's push activity) with its current tip, so a push the activity doesn't show yet is still included, processing only the changed paths. A file is also refreshed when one of its includedFiles changes, a skill with includeSkillFolder when any file in its folder changes, and a folder when any path inside it changes. A repository is read in whole when the comparison cannot be trusted (no activity reaching back to the cursor, a branch created or rewritten since, or 300+ changed files). Deletions are not processed incrementally; the next full resync removes them.
