# includeComments is only a boolean; to limit which pull requests get comments,
# add this as another pull-request block and filter with selector.query;
# leave the default pull-request block unchanged.
- kind: pull-request
  selector:
    query: '.labels.isAi == true'
    includeComments: true
    commentsMaxAgeDays: 30
  port:
    itemsToParse: .__comments
    entity:
      mappings:
        identifier: .item.__commentId
        title: .item.__body // "" | .[0:120]
        blueprint: '"githubPullRequestComment"'
        properties:
          body: .item.__body
          author: .item.__author
          createdAt: .item.__createdAt
          updatedAt: .item.__updatedAt
          url: .item.__url
          commentType: .item.__commentType
        relations:
          pullRequest: .head.repo.name + (.id|tostring)
