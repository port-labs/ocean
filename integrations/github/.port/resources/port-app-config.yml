deleteDependentEntities: true
createMissingRelatedEntities: true
repositoryType: 'all'
resources:
  - kind: organization
    selector:
      query: 'true'
    port:
      entity:
        mappings:
          identifier: .login
          title: .login
          blueprint: '"githubOrganization"'
          properties:
            login: .login
            id: .id
            nodeId: .node_id
            url: .url
            reposUrl: .repos_url
            eventsUrl: .events_url
            hooksUrl: .hooks_url
            issuesUrl: .issues_url
            membersUrl: .members_url
            publicMembersUrl: .public_members_url
            avatarUrl: .avatar_url
            description: if .description then .description else "" end
  - kind: repository
    selector:
      query: 'true'
      includedFiles:
        - README.md
        - CODEOWNERS
    port:
      entity:
        mappings:
          identifier: .name
          title: .name
          blueprint: '"githubRepository"'
          properties:
            description: if .description then .description else "" end
            visibility: if .private then "private" else "public" end
            defaultBranch: .default_branch
            readme: .__includedFiles["README.md"]
            codeowners: .__includedFiles["CODEOWNERS"]
            url: .html_url
            language: if .language then .language else "" end
          relations:
            organization: .owner.login
  - kind: pull-request
    selector:
      query: 'true'
      states:
        - open
      api: graphql
      enrichWithFirstCommit: true
      excludeGraphqlFields:
        - additions
        - deletions
        - changedFiles
    port:
      entity:
        mappings:
          identifier: .head.repo.name + (.id|tostring)
          blueprint: '"githubPR"'
          title: .title
          properties:
            creator: (.author.login | gsub("\\["; "-") | gsub("\\](?=[^$])"; "-") | gsub("\\]$"; ""))
            assignees: >-
              [(.assignees.nodes // .assignees // []) | .[] | select(. != null) | (.login | gsub("\\["; "-") |
              gsub("\\](?=[^$])"; "-") | gsub("\\]$"; ""))]
            reviewers: '[.requested_reviewers[].login | gsub("\\](?=[^$])"; "-") | gsub("\\]$"; "")]'
            status: .state
            closedAt: .closedAt
            updatedAt: .updatedAt
            mergedAt: .mergedAt
            createdAt: .createdAt
            prNumber: .number
            link: .url
            leadTimeHours: >-
              (.createdAt as $createdAt | .mergedAt as $mergedAt | if $createdAt == null or $mergedAt == null then null
              else ((($mergedAt | strptime("%Y-%m-%dT%H:%M:%SZ") | mktime) -
                ($createdAt | strptime("%Y-%m-%dT%H:%M:%SZ") | mktime)) / 3600 * 100 | floor) / 100
              end)
            isDraft: .isDraft
            reviewDecision: .reviewDecision
            firstCommitAt: .firstCommit.committedDate
            firstReviewAt: (.reviews.nodes | map(select(.createdAt != null)) | sort_by(.createdAt) | first.createdAt) // null
            approvedAt: >-
              (.reviews.nodes | map(select(.state == "APPROVED" and .createdAt != null)) | sort_by(.createdAt) |
              last.createdAt) // null
            readyForReviewAt: (if .isDraft == true then null else .createdAt end)
            codingTimeHours: >-
              (.firstCommit.committedDate as $first | (if .isDraft == true then null else .createdAt end) as $ready | if
              $first == null or $ready == null then null else ((($ready | strptime("%Y-%m-%dT%H:%M:%SZ") | mktime) -
                ($first | strptime("%Y-%m-%dT%H:%M:%SZ") | mktime)) / 3600 * 100 | floor) / 100
              end)
            timeToFirstReview: >-
              (.createdAt as $created | (.reviews.nodes | map(select(.createdAt != null)) | sort_by(.createdAt) |
              first.createdAt) as $firstReview | if $created == null or $firstReview == null then null else
              ((($firstReview | strptime("%Y-%m-%dT%H:%M:%SZ") | mktime) -
                ($created | strptime("%Y-%m-%dT%H:%M:%SZ") | mktime)) / 3600 * 100 | floor) / 100
              end)
            timeFromApprovalToMerge: >-
              ((.reviews.nodes | map(select(.state == "APPROVED" and .createdAt != null)) | sort_by(.createdAt) |
              last.createdAt) as $approved | .mergedAt as $merged | if $approved == null or $merged == null then null
              else ((($merged | strptime("%Y-%m-%dT%H:%M:%SZ") | mktime) -
                ($approved | strptime("%Y-%m-%dT%H:%M:%SZ") | mktime)) / 3600 * 100 | floor) / 100
              end)
          relations:
            repository: .__repository
