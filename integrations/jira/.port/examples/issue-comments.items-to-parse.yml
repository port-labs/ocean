# includeComments is only a boolean; to limit which issues get comments,
# add this as another issue block and filter with that block's selector;
# leave the default issue block unchanged.
- kind: issue
  selector:
    query: 'true'
    # Replace with your own JQL so only selected issues are fetched for comments.
    jql: 'key in (PROJ-1, PROJ-2)'
    includeComments: true
    commentsMaxAgeDays: 30
  port:
    itemsToParse: .__comments
    entity:
      mappings:
        identifier: .item.__commentId
        title: .item.__body // "" | .[0:120]
        blueprint: '"jiraIssueComment"'
        properties:
          body: .item.__body
          author: .item.author.emailAddress // .item.author.displayName // .item.author.accountId
          createdAt: .item.created
          updatedAt: .item.updated
          url: .item.__url
        relations:
          issue: .key
