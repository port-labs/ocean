deleteDependentEntities: true
createMissingRelatedEntities: true
resources:
  - kind: agent
    selector:
      query: 'true'
    port:
      entity:
        mappings:
          identifier: .id // .name
          title: .name // .id
          blueprint: '"foundry_agent"'
          properties:
            kind: .kind
            model: .model
            instructions: .instructions
            description: .description
            status: .status
            configurationState: .configuration_state
            version: .version
            versionStatus: .version_status
            agentGuid: .agent_guid
            toolCount: .tool_count
            tools: .tools
            sourcePlatform: .source_platform
            owner: .owner
            metadata: .metadata
            entraPrincipalId: .entra_principal_id
            entraClientId: .entra_client_id
            identityBlueprintId: .identity_blueprint_id
            createdAt: .created_at
          relations:
            modelDeployment: .model
  - kind: agent-version
    selector:
      query: 'true'
    port:
      entity:
        mappings:
          identifier: .id
          title: .id
          blueprint: '"foundry_agent_version"'
          properties:
            agentId: .agent_id
            version: .version
            kind: .kind
            model: .model
            instructions: .instructions
            description: .description
            versionStatus: .version_status
            isDraft: .is_draft
            sourcePlatform: .source_platform
            owner: .owner
            metadata: .metadata
            tools: .tools
            toolCount: .tool_count
            entraPrincipalId: .entra_principal_id
            entraClientId: .entra_client_id
            createdAt: .created_at
            updatedAt: .updated_at
          relations:
            agent: .agent_id
  - kind: model-deployment
    selector:
      query: 'true'
    port:
      entity:
        mappings:
          identifier: .id // .name
          title: .name // .id
          blueprint: '"foundry_model_deployment"'
          properties:
            model: .model
            modelVersion: .model_version
            modelPublisher: .model_publisher
            deploymentType: .deployment_type
            sku: .sku
            capabilities: .capabilities
            createdAt: .created_at
            updatedAt: .updated_at
  - kind: conversation
    selector:
      query: 'true'
      sinceDays: 365
    port:
      entity:
        mappings:
          identifier: .id
          title: .id
          blueprint: '"foundry_conversation"'
          properties:
            createdAt: .created_at
            metadata: .metadata
            promptTokens: .prompt_tokens
            completionTokens: .completion_tokens
            totalTokens: .total_tokens
            toolCallCount: .tool_call_count
          relations:
            agents: .participant_agent_ids
            modelDeployments: .participant_model_deployment_ids
  - kind: response
    selector:
      query: 'true'
      sinceDays: 365
    port:
      entity:
        mappings:
          identifier: .id
          title: .id
          blueprint: '"foundry_response"'
          properties:
            status: .status
            createdAt: .created_at
            promptTokens: .prompt_tokens
            completionTokens: .completion_tokens
            totalTokens: .total_tokens
            toolCallCount: .tool_call_count
          relations:
            conversation: .conversation_id
            agent: .agent_id
            modelDeployment: .model_deployment_id
  - kind: skill
    selector:
      query: 'true'
    port:
      entity:
        mappings:
          identifier: .id // .name
          title: .name // .id
          blueprint: '"foundry_skill"'
          properties:
            name: .name
            description: .description
            latestVersion: .latest_version
            createdAt: .created_at
            updatedAt: .updated_at
  - kind: memory-store
    selector:
      query: 'true'
    port:
      entity:
        mappings:
          identifier: .id // .name
          title: .name // .id
          blueprint: '"foundry_memory_store"'
          properties:
            name: .name
            description: .description
            createdAt: .created_at
            metadata: .metadata
