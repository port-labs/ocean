# includeComments is only a boolean; to limit which merge requests get comments,
# add this as another merge-request block and filter with selector.query;
# leave the default merge-request block unchanged.
- kind: merge-request
  selector:
    query: .labels.isAi == true
    includeComments: true
  port:
    itemsToParse: .__comments
    entity:
      mappings:
        identifier: .item.__commentId
        title: .item.body // "" | .[0:120]
        blueprint: '"gitlabMergeRequestComment"'
        properties:
          body: .item.body
          author: .item.author.username // .item.author.name
          createdAt: .item.created_at
          updatedAt: .item.updated_at // .item.created_at
          url: .item.url
          commentType: .item.__commentType
        relations:
          mergeRequest: .id | tostring
