bump: patch
changelog-type: improvement
changelog: |
  File discovery for the `file` kind now walks each repository through Bitbucket's Source API with a server-side filter, replacing the code search API that Bitbucket is retiring. This makes the kind work on workspaces that do not have code search enabled, where it previously returned nothing and deleted its existing file entities on every resync, and a file is discovered as soon as it is committed rather than once Bitbucket has indexed it. Content is fetched by repository slug at the commit the listing returned, so repositories whose display name differs from their slug are no longer missed.

  A workspace the kind cannot list is now reported as a failure rather than as "no matching files", so reconciliation no longer deletes every file entity when discovery is broken. This is the case where the old path silently deleted: code search is not enabled, or the credential cannot read the workspace. Where a sub-path is configured, a 404 on it still means "no files", because that is also what Bitbucket answers for a directory that genuinely does not exist.

  `userRole` and `repoQuery`, already available on the `repository` and `folder` kinds, now narrow file discovery too, so it no longer has to walk the whole workspace; both default to no filter. Discovered files are emitted in batches, and content fetches are bounded across repositories.

  Three changes to existing behaviour. `.metadata` is now the Source API listing entry instead of the code search `file` object, gaining `size`, `mimetype`, `escaped_path` and two `links` entries, and `.repo` is the full repositories-listing entry instead of `file.commit.repository`, gaining `slug`, `workspace`, `project` and the rest of the repository object; both are measured supersets of what they replace, and `.metadata.commit.repository.*` is preserved. A configured filename now has to match a whole path segment, so `port.yml` no longer matches `airport.yml`, and a bare extension such as `.yml` no longer matches every YAML file - list the filenames you want. And a file that the listing returned but whose content cannot be read is skipped with the reason logged, instead of being ingested with empty content.
