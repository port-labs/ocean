createMissingRelatedEntities: true
deleteDependentEntities: true
resources:
  - kind: serviceDependency
    selector:
      query: 'true'
      environment: 'dev'
      startTime: 1
    port:
      entity:
        mappings:
          identifier: .name | tostring
          title: .name
          blueprint: '"datadogServiceDependency"'
          properties:
            sourceService: .name
          relations:
            dependencies: '[.calls[] | tostring]'
  - kind: serviceMetric
    selector:
      query: 'true'
      datadogSelector:
        metric: avg:system.disk.used
        env:
          tag: env
          value: '*'
        service:
          tag: service
          value: '*'
        timeframe: 5
    port:
      entity:
        mappings:
          identifier: .__query_id
          title: .query
          blueprint: '"datadogServiceMetric"'
          properties:
            query: .__query
            series: .series
            res_type: .res_type
            from_date: .from_date / 1000 | todate
            to_date: .to_date / 1000 | todate
            env: .__env
          relations:
            service: .__service

  - kind: serviceMetric
    selector:
      query: "true"
      datadogSelector:
        metric: "avg:system.mem.used"
        env:
          tag: env
          value: prod
        service:
          tag: servicename
          value: 'prod'
        timeframe: 5
    port:
      entity:
        mappings:
          blueprint: '"datadogServiceMetric"'
          identifier: .__query_id
          title: .query
          properties:
            query: .__query
            series: .series
            res_type: .res_type
            from_date: ".from_date / 1000 | todate"
            to_date: ".to_date / 1000 | todate"
            env: .__env
          relations:
            service: .__service

  - kind: sloHistory
    selector:
      query: "true"
      timeframe: 30
      periodOfTimeInMonths: 6
    port:
      entity:
        mappings:
          identifier: >-
            (.slo.id | tostring) + "-" + (.from_ts | tostring) + "-" + (.to_ts |
            tostring)
          title: .slo.name
          blueprint: '"datadogSloHistory"'
          properties:
            monitory_type: .type
            sampling_start_date: .from_ts | todate
            sampling_end_date: .to_ts | todate
            sliValue: .overall.sli_value
            timeframe: .__timeframe
          relations:
            slo: .slo.id

  - kind: serviceDependency
    selector:
      query: 'true'
      environment: prod
      startTime: 1
    port:
      entity:
        mappings:
          identifier: .name | tostring
          title: .name
          blueprint: '"datadogServiceDependency"'
          properties:
            sourceService: .name
          relations:
            dependencies: if .calls then .calls[] else [] end
  - kind: catalogEntity
    selector:
      query: 'true'
      includeDiscovered: 'false'
    port:
      entity:
        mappings:
          # shortcut: ambiguous if a name contains "/" — namespace "a" + name "b"
          # renders as namespace "default" + name "a/b"; revisit if an org uses namespaces
          identifier: >-
            .attributes.kind + ":" + (if .attributes.namespace == "default"
            then "" else .attributes.namespace + "/" end) +
            .attributes.name
          title: .attributes.displayName // .attributes.name
          blueprint: '"datadogCatalogEntity"'
          properties:
            kind: .attributes.kind
            namespace: .attributes.namespace
            description: .attributes.description
            owner: .attributes.owner
            tags: .attributes.tags
            type: .__schema.spec.type
            tier: .__schema.spec.tier
            lifecycle: .__schema.spec.lifecycle
            languages: .__schema.spec.languages
            links: .__schema.metadata.links // [] | map(.url)
            ingestionSource: .meta.ingestionSource
            createdAt: .meta.createdAt
            updatedAt: .meta.modifiedAt
            emailContacts: >-
              [.__schema.metadata.contacts // [] | .[] | select(.type ==
              "email") | .contact]
            additionalOwners: .__schema.metadata.additionalOwners // [] | map(.name)
          relations:
            dependsOn: .__schema.spec.dependsOn // [] | map(sub(":default/"; ":"))
            componentOf: .__schema.spec.componentOf // [] | map(sub(":default/"; ":"))
            components: .__schema.spec.components // [] | map(sub(":default/"; ":"))
            implementedBy: .__schema.spec.implementedBy // [] | map(sub(":default/"; ":"))
            team:
              combinator: '"and"'
              rules:
                - property: '"handle"'
                  operator: '"="'
                  value: .attributes.owner
