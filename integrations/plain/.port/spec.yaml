description: Plain integration for Port Ocean
icon: Cookiecutter  # Should be one of the available icons in Port
features:
  - type: exporter
    section: Under Development  # Should be one of the available sections in Port
    resources:
      - kind: company
      - kind: tenant
      - kind: user
      - kind: customer
      - kind: thread
      - kind: example-kind
configurations:
  - name: myplainToken
    # required: true
    type: string
    sensitive: true
  - name: someApplicationUrl
    type: url
  - name: threadStatusFilter
    type: string
    required: false
    description: Comma-separated thread statuses to sync (TODO, SNOOZED, DONE). Omit to sync every status.
