changelog: Added `RawEnricherClass` / `MappingRefRawEnricher` so integrations keep the deprecated `file://` and `search://` mapping values working with the data-source-processor. The values are resolved onto raw items (`__includedFiles` / `__search`), which the resync mapping sent to the data-source-processor reads, and every use logs a deprecation warning pointing to the `includedFiles` / `searchQueries` selectors.
