changelog: Ask Port for the executor view of the config (resourcesView=executor) and read the optional resourceId on each resource. In DSP mode, blocks sharing a resourceId (same kind and selector) are fetched once under the first block's kind slot and the raw data carries the resourceId so DSP maps it through every block; blocks whose itemsToParse settings differ are fetched separately. resourceId is never sent back to Port in config writes. Without resourceIds, behaviour is unchanged
