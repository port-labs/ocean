changelog: Add opt-in live-event payload logging requiring both OCEAN__LIVE_EVENTS__PAYLOAD_LOGGING_ENABLED (default false) and org feature flag LIVE_EVENTS_PAYLOAD_LOGGING_ENABLED. When gates are off, live-event timestamp logs use compact identifiers; when both gates are on, full masked payloads log at DEBUG for all timestamp types including finish.
