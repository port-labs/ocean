bump: minor
changelog-type: improvement
changelog: |
  Fail fast on SSL/TLS certificate errors without retrying.

  SSL/TLS errors (certificate verification failures, hostname mismatches, expired certificates)
  are now detected and raised immediately without retry attempts. These errors indicate
  configuration or trust issues that cannot be resolved by retrying.

  Transient connection errors (timeouts, connection refused) continue to be retried as before.
