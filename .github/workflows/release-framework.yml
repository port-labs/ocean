name: Release framework
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'

env:
  PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
  PYPI_USERNAME: ${{ secrets.PYPI_USERNAME }}
jobs:
  tag-main:
    name: Tag main branch and create release
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    runs-on: ubuntu-latest
    outputs:
      current_tag: ${{ steps.get_current_version.outputs.current_tag }}
      prev_tag: ${{ steps.get_previous_version.outputs.prev_tag }}
      release_exists: ${{ steps.check_release.outputs.release_exists }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current version
        id: get_current_version
        run: |
          # Get the current version from pyproject.toml
          CURRENT_TAG=$(grep -E '^version = ".*"' pyproject.toml | cut -d'"' -f2)
          echo "current_tag=${CURRENT_TAG}" >> $GITHUB_ENV
          echo "current_tag=${CURRENT_TAG}" >> $GITHUB_OUTPUT
      - name: Get previous version
        id: get_previous_version
        run: |
          # Get the version from the previous commit for comparison
          # Handle case where HEAD~1 doesn't exist (first commit) or file doesn't exist
          PREV_TAG=$(git show HEAD~1:pyproject.toml 2>/dev/null | grep -E '^version = ".*"' | cut -d'"' -f2 || echo "")
          echo "prev_tag=${PREV_TAG}" >> $GITHUB_ENV
          echo "prev_tag=${PREV_TAG}" >> $GITHUB_OUTPUT

      - name: Check if release already exists
        id: check_release
        run: |
          CURRENT_TAG="${{ steps.get_current_version.outputs.current_tag }}"
          PREV_TAG="${{ steps.get_previous_version.outputs.prev_tag }}"
          if git ls-remote --tags origin | grep -q "refs/tags/v${CURRENT_TAG}$"; then
            echo "::notice::Tag v${CURRENT_TAG} already exists, exiting without releasing again"
            echo "release_exists=true" >> $GITHUB_OUTPUT
          elif [ -n "${PREV_TAG}" ] && [ "${CURRENT_TAG}" = "${PREV_TAG}" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            # Push with no version bump and no existing tag: nothing to release
            echo "release_exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag v${CURRENT_TAG} does not exist, will create"
            echo "release_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Tag main
        if: steps.check_release.outputs.release_exists != 'true'
        run: |
          CURRENT_TAG="${{ steps.get_current_version.outputs.current_tag }}"
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          LATEST_COMMIT_MESSAGE=$(git log -1 --pretty=format:%s)
          git tag -a "v${CURRENT_TAG}" -m "${LATEST_COMMIT_MESSAGE}"
          # Explicitly push the tag (not a branch)
          git push origin refs/tags/v${CURRENT_TAG}
      - name: Create GitHub Release
        if: steps.check_release.outputs.release_exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.get_current_version.outputs.current_tag }}
          name: Ocean Framework ${{ steps.get_current_version.outputs.current_tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.get_current_version.outputs.current_tag, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_ocean:
    name: Publish framework to PyPI
    needs: tag-main
    if: github.ref == 'refs/heads/main' && needs.tag-main.outputs.release_exists != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.tag-main.outputs.current_tag }}

      - name: Make install and build
        run: |
            make install
            make build

      - name: Set version from tag-main output
        run: echo "VERSION=${{ needs.tag-main.outputs.current_tag }}" >> $GITHUB_ENV

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: ${{ env.PYPI_USERNAME }}
          password: ${{ env.PYPI_PASSWORD }}
          packages-dir: ${{github.workspace}}/dist

      - name: Wait for package to be available on PyPI
        run: |
          while ! pip --no-cache-dir index versions port-ocean | grep -q "${{ env.VERSION }}"; do
            echo "Waiting for package ${{ env.VERSION }} to be available on PyPI..."
            sleep 2
          done

      - name: Trigger apply-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run apply-release.yml \
            --ref main \
            -f version="${{ env.VERSION }}" \
            -f actor="${{ github.actor }}"

      - name: Send internal release notification
        if: success()
        continue-on-error: true
        uses: fjogeleit/http-request-action@v2
        with:
          url: ${{ secrets.OCEAN_SLACK_WEBHOOK }}
          method: 'POST'
          customHeaders: '{"Content-Type": "application/json"}'
          data: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":tada: *New Version of Ocean Framework Released!* :tada:"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "We are excited to announce the release of a new version of the Ocean framework! :ocean: :rocket:"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Version:* `${{ env.VERSION }}`"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<https://github.com/port-labs/ocean/blob/v${{ env.VERSION }}/CHANGELOG.md|Check out the Changelog>"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Happy sailing! :ocean: :heart:"
                  }
                }
              ]
            }

      - name: Send Slack failure notification
        if: failure()
        continue-on-error: true
        uses: fjogeleit/http-request-action@v2
        with:
          url: ${{ secrets.OCEAN_SLACK_WEBHOOK }}
          method: 'POST'
          customHeaders: '{"Content-Type": "application/json"}'
          data: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Ocean framework release failed!* :x:"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Triggered by:* <https://github.com/${{ github.actor }}|${{ github.actor }}>"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Version:* `${{ env.VERSION || needs.tag-main.outputs.current_tag }}`"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Workflow run:* <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
                  }
                }
              ]
            }
