name: Validate integration files

on:
  pull_request:


jobs:
  detect-changes:
    uses: ./.github/workflows/detect-changes-matrix.yml

  validate-files:
    needs: detect-changes
    runs-on: ubuntu-latest

    steps:
      - name: No integration changes
        if: needs.detect-changes.outputs.has_integration_code_changes != 'true'
        run: echo "No integration changes detected"

      - name: Checkout code
        if: needs.detect-changes.outputs.has_integration_code_changes == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate integration version format
        if: needs.detect-changes.outputs.has_integration_code_changes == 'true'
        run: |
          git remote add ocean-origin https://github.com/port-labs/ocean.git
          git fetch ocean-origin
          changed_dirs=$(git diff --name-only ocean-origin/main HEAD | grep 'integrations/' | cut -d'/' -f 1,2 | sort -u)
          for dir in $changed_dirs; do
            pyproject_file=$(find $dir -name 'pyproject.toml' -not -path "**/.venv/*")
            if [ -n "$pyproject_file" ]; then
              version=$(grep -E '^version = ".*"' "$pyproject_file" | cut -d'"' -f2)

              # Define allowed version patterns
              if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(post1|dev|beta))?$ ]]; then
                echo "ERROR: Invalid version format in $pyproject_file: $version"
                echo "Allowed formats:"
                echo "  - Stable: 1.2.3 release version"
                echo "  - Beta: 1.2.3-beta for pre-release"
                echo "  - Dev: 1.2.3-dev for development"
                echo "  - Deprecated: 1.2.3-post1 for deprecated version"
                exit 1
              fi
              echo "Version format is valid: $version"
            fi
          done
