name: Trigger Load Test

permissions:
  contents: read
  statuses: write

on:
  push:
    branches:
      - main
    paths:
      - 'integrations/**'
      - 'port_ocean/**'

concurrency:
  group: trigger-load-test-${{ github.sha }}
  cancel-in-progress: false

jobs:
  detect-changes:
    uses: ./.github/workflows/detect-changes-matrix.yml

  resolve-targets:
    name: Resolve load test targets
    needs: detect-changes
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      integration_arg: ${{ steps.resolve.outputs.integration_arg }}
      targets_json: ${{ steps.resolve.outputs.targets_json }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Check out ocean-load-tests harness list
        uses: actions/checkout@v7
        with:
          repository: port-labs/ocean-load-tests
          ref: main
          path: ocean-load-tests
          sparse-checkout: |
            integrations
          sparse-checkout-cone-mode: false
          # Only needs read access to this private repo's tree — no longer
          # needs actions:write now that run-load-test calls it via
          # workflow_call instead of `gh workflow run`/`gh run watch`.
          token: ${{ secrets.OCEAN_LOAD_TEST_DISPATCH_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve targets
        id: resolve
        env:
          CHANGED_INTEGRATIONS_JSON: ${{ needs.detect-changes.outputs.integrations }}
          HAS_CORE_CODE_CHANGES: ${{ needs.detect-changes.outputs.has_core_code_changes }}
          HAS_CODE_CHANGES: ${{ needs.detect-changes.outputs.has_code_changes }}
          LOAD_TEST_REPO_ROOT: ocean-load-tests
        run: python scripts/ci/load_test_targets.py

  mark-load-test-pending:
    name: Mark load test pending
    needs: resolve-targets
    if: needs.resolve-targets.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Post pending commit status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'load-test/shallow',
              description: 'Shallow integration load test in progress',
            });

  # Calls ocean-load-tests directly as a reusable workflow (workflow_call)
  # instead of a disconnected `gh workflow run` + polling loop: this job's
  # own pass/fail *is* the load test's pass/fail, with no run-ID lookup race
  # condition and no PAT needed for the dispatch itself (secrets: inherit
  # works because both repos are in the port-labs org). Only reachable in
  # ocean-load-tests' shallow (GHA) path — deep/K8s mode stays gated on
  # workflow_dispatch there and isn't invoked from here.
  run-load-test:
    name: Run shallow load test
    needs: [resolve-targets, mark-load-test-pending]
    if: needs.resolve-targets.outputs.should_run == 'true'
    uses: port-labs/ocean-load-tests/.github/workflows/load-test.yml@main
    with:
      integration: ${{ needs.resolve-targets.outputs.integration_arg }}
      ocean_version: ${{ github.sha }}
      rate_limit_mode: shallow
    secrets: inherit

  report-load-test:
    name: Report load test result
    needs: [resolve-targets, run-load-test]
    if: always() && needs.resolve-targets.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Post final commit status
        uses: actions/github-script@v7
        env:
          RUN_RESULT: ${{ needs.run-load-test.result }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const passed = process.env.RUN_RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'load-test/shallow',
              description: passed
                ? 'Shallow load test passed'
                : 'Shallow load test failed',
              target_url: process.env.TARGET_URL,
            });
            if (!passed) {
              core.setFailed(`Load test did not pass (result: ${process.env.RUN_RESULT})`);
            }

      - name: Write job summary
        run: |
          {
            echo "### Shallow load test"
            echo "- **Integrations:** \`${{ needs.resolve-targets.outputs.integration_arg }}\`"
            echo "- **Ocean SHA:** \`${{ github.sha }}\`"
            echo "- **Result:** ${{ needs.run-load-test.result }}"
          } >> "$GITHUB_STEP_SUMMARY"

  skip-load-test:
    name: Skip load test
    needs: resolve-targets
    if: needs.resolve-targets.outputs.should_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Log skip reason
        run: |
          echo "Load test skipped — no harness for the changed integrations on this commit."
          echo "targets_json=${{ needs.resolve-targets.outputs.targets_json }}"
