name: Version and Changelog Check

on:
  pull_request:

jobs:
  check-version-changelog:
    name: Check Version & Changelog Updates
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get base branch
        id: base-branch
        run: |
          if [ "${{ github.event.pull_request.base.ref }}" != "" ]; then
            echo "base=${{ github.event.pull_request.base.ref }}" >> $GITHUB_OUTPUT
          else
            echo "base=main" >> $GITHUB_OUTPUT
          fi

      - name: Fetch base branch
        run: git fetch origin ${{ steps.base-branch.outputs.base }}

      - name: Validate release intent
        run: |
          python3 scripts/ci/validate_ocean_release.py \
            --base "origin/${{ steps.base-branch.outputs.base }}" \
            --head HEAD

      - name: Validate changelog formatting
        run: |
          mapfile -t CHANGED < <(
            git diff --name-only "origin/${{ steps.base-branch.outputs.base }}...HEAD" \
              | grep -E '(^|/)CHANGELOG\.md$' || true
          )
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "No changelogs to validate; skipping"
            exit 0
          fi
          python3 scripts/validate_changelog.py --paths "${CHANGED[@]}"
