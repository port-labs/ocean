name: Release integrations
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-integrations-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.prepare-matrix.outputs.INTEGRATIONS_MATRIX }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Prepare matrix
        id: prepare-matrix
        run: |
          source scripts/ci/integration_spec.sh
          integrations_to_release=()
          # Get the list of integrations
          mapfile -t files < <(find_integration_spec_files)
          for file in "${files[@]}"; do
            folder=$(dirname "$file")
            type=$(grep -E '^name = ".*"' "$folder/../pyproject.toml" | cut -d'"' -f2)

            # Get the version from pyproject.toml
            version=$(grep -E '^version = ".*"' "$folder/../pyproject.toml" | cut -d'"' -f2)

            # Check if the version exists in the ghcr.io registry
            rc=0
            docker manifest inspect ghcr.io/port-labs/port-ocean-$type:$version > /dev/null 2>&1 || rc=$?

            if [ $rc -eq 0 ]; then
              echo "Image already exists in $repository: port-ocean-$type:$version"
            else
              integrations_to_release+=($file)
            fi
          done
          if [ ${#integrations_to_release[@]} -eq 0 ]; then
            matrix_json='[]'
          else
            matrix_json=$(printf '%s\n' "${integrations_to_release[@]}" | jq -R -s -c 'split("\n")[:-1]')
          fi
          echo "$matrix_json"
          echo "INTEGRATIONS_MATRIX=$matrix_json" >> $GITHUB_OUTPUT

  release-integration:
    runs-on: ubuntu-latest
    if: needs.prepare-matrix.outputs.matrix != '[]'
    outputs:
      is_dev_version: ${{ steps.prepare_tags.outputs.is_dev_version }}
    permissions:
      id-token: write
      packages: write
      contents: read
    needs: [prepare-matrix]
    strategy:
      # limit the number of parallel jobs to avoid hitting the ghcr.io rate limit
      max-parallel: 5
      matrix:
        integration: ${{fromJson(needs.prepare-matrix.outputs.matrix)}}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Prepare Docker images tags
        id: prepare_tags
        run: |
          current_integration_spec=${{ matrix.integration }}

          folder=$(dirname "$current_integration_spec")
          context_dir=$(dirname "$folder")
          echo "context_dir=$context_dir" >> $GITHUB_OUTPUT

          version=$(grep -E '^version = ".*"' "$folder/../pyproject.toml" | cut -d'"' -f2)
          type=$(grep -E '^name = ".*"' "$folder/../pyproject.toml" | cut -d'"' -f2)
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "type=$type" >> $GITHUB_OUTPUT

          dockerfile_path=integrations/_infra/Dockerfile
          if test -e $folder/../Dockerfile; then
            dockerfile_path=$folder/../Dockerfile
          fi
          echo "dockerfile_path=$dockerfile_path" >> $GITHUB_OUTPUT
          # Check if the version is either numeric (e.g. 1.2.3), has a post suffix (e.g. 1.2.3.post1 or 1.2.3-post1), or is a beta version (e.g. 1.2.3-beta)
          if [[ "$version" =~ ^[0-9.]+$ || "$version" =~ ^[0-9.]+[.-]post[0-9]+$ || "$version" =~ ^[0-9.]+-beta[0-9]*$ ]]; then
            # Allowed versions: stable, post-release, and beta → apply latest tag
            tags="ghcr.io/port-labs/port-ocean-$type:$version,ghcr.io/port-labs/port-ocean-$type:latest"
            echo "tags=$tags" >> $GITHUB_OUTPUT
            echo "is_dev_version=false" >> $GITHUB_OUTPUT
            echo "Version is stable, post-release, or beta. Building with 'latest' tag."
          else
            # Other versions like rc, alpha, etc. → skip latest tag
            tags="ghcr.io/port-labs/port-ocean-$type:$version"
            echo "tags=$tags" >> $GITHUB_OUTPUT
            echo "is_dev_version=true" >> $GITHUB_OUTPUT
            echo "Version is pre-release (excluding beta). Building without 'latest' tag."
          fi

      - name: Build Docker Image
        uses: ./.github/workflows/actions/build-docker-image
        with:
          dockerfile: ${{ steps.prepare_tags.outputs.dockerfile_path }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.prepare_tags.outputs.tags }}
          build-args: |
            BUILD_CONTEXT=${{ steps.prepare_tags.outputs.context_dir }}
            INTEGRATION_VERSION=${{ steps.prepare_tags.outputs.version }}
          docker-user: ${{ secrets.DOCKER_MACHINE_USER }}
          docker-password: ${{ secrets.PORT_MACHINE_USER_GITHUB_TOKEN }}

      - name: Get image sizes
        continue-on-error: true
        id: image_size
        run: |
          IMAGE="ghcr.io/port-labs/port-ocean-${{ steps.prepare_tags.outputs.type }}:${{ steps.prepare_tags.outputs.version }}"

          for arch in amd64 arm64; do
            echo "📦 Pulling ${arch} image..."
            docker pull --platform "linux/${arch}" "${IMAGE}"
            if [[ $? -ne 0 ]]; then
              echo "⚠️ Failed to pull ${arch} image"
              exit 1
            fi

            # `docker images` can output multiple rows for the same reference; pick a single deterministic value.
            RAW_SIZE="$(docker images "${IMAGE}" --format '{{.VirtualSize}}' | head -n 1)"
            if [[ -z "${RAW_SIZE}" ]]; then
              echo "⚠️ Failed to get virtual size for ${arch}"
              exit 1
            fi

            echo "🔎 Debug: raw 'docker images ${IMAGE}' output (${arch}): ${RAW_SIZE}"

            SIZE="$(
              awk -v s="${RAW_SIZE}" 'BEGIN{IGNORECASE=1
                val = s
                gsub(/[^0-9.]/,"",val)
                if (s ~ /GB/) print int(val * 1073741824)
                else if (s ~ /MB/) print int(val * 1048576)
                else if (s ~ /KB/) print int(val * 1024)
                else print int(val)
              }'
            )"
            echo "🔎 Debug: converted size for ${arch}: ${SIZE}"
            echo "size_bytes_linux_${arch}=${SIZE}" >> $GITHUB_OUTPUT

          done

      - name: Track image size in New Relic (amd64)
        if: steps.image_size.outputs.size_bytes_linux_amd64
        continue-on-error: true
        uses: ./.github/actions/new-relic-metric
        with:
          metric_name: "image.size"
          metric_value: ${{ steps.image_size.outputs.size_bytes_linux_amd64 }}
          new_relic_api_key: ${{ secrets.NEW_RELIC_INGEST_API_KEY }}
          metric_attributes: |
            {
              "image_name": "port-ocean-${{ steps.prepare_tags.outputs.type }}",
              "image_version": "${{ steps.prepare_tags.outputs.version }}",
              "platform": "linux/amd64",
              "size_bytes": ${{ steps.image_size.outputs.size_bytes_linux_amd64 }}
            }

      - name: Track image size in New Relic (arm64)
        if: steps.image_size.outputs.size_bytes_linux_arm64
        continue-on-error: true
        uses: ./.github/actions/new-relic-metric
        with:
          metric_name: "image.size"
          metric_value: ${{ steps.image_size.outputs.size_bytes_linux_arm64 }}
          new_relic_api_key: ${{ secrets.NEW_RELIC_INGEST_API_KEY }}
          metric_attributes: |
            {
              "image_name": "port-ocean-${{ steps.prepare_tags.outputs.type }}",
              "image_version": "${{ steps.prepare_tags.outputs.version }}",
              "platform": "linux/arm64",
              "size_bytes": ${{ steps.image_size.outputs.size_bytes_linux_arm64 }}
            }

      - name: Configure AWS Credentials 🔒
        if: steps.prepare_tags.outputs.is_dev_version == 'false'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.ECR_PULL_THROUGH_CACHE_AWS_REGION }}
          role-to-assume: ${{ vars.ECR_PULL_THROUGH_CACHE_DELETE_ROLE_ARN }}

      - name: Login to ECR
        if: steps.prepare_tags.outputs.is_dev_version == 'false'
        uses: aws-actions/amazon-ecr-login@v1
        with:
          mask-password: 'true'

      - name: Delete ECR pull through cache repository
        if: steps.prepare_tags.outputs.is_dev_version == 'false'
        run: |
          repository_name="github/port-labs/port-ocean-${{ steps.prepare_tags.outputs.type }}"
          aws_region="${{ vars.ECR_PULL_THROUGH_CACHE_AWS_REGION }}"

          echo "Attempting to delete ECR pull through cache repository: $repository_name"

          # Check if repository exists
          if ! aws ecr describe-repositories \
            --repository-names "$repository_name" \
            --region "$aws_region" \
            >/dev/null 2>&1; then
            echo "Repository does not exist in ECR, skipping deletion: $repository_name"
            exit 0
          fi

          # Delete the entire repository
          if aws ecr delete-repository \
            --repository-name "$repository_name" \
            --region "$aws_region" \
            --force \
            >/dev/null 2>&1; then
            echo "Successfully deleted ECR pull through cache repository: $repository_name"
          else
            echo "Failed to delete ECR repository: $repository_name"
            exit 1
          fi

  upload-specs:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    needs: [prepare-matrix, release-integration]
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials 🔒
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload specifications to s3
        env:
          INTEGRATIONS_MATRIX: ${{ needs.prepare-matrix.outputs.matrix }}
        run: |
          set -euo pipefail
          source scripts/ci/integration_spec.sh

          temp_file="temp.yaml"
          index_file="index.json"
          aws_s3_bucket="ocean-registry"
          staging_root=".upload-specs-staging"
          candidates_file="$staging_root/candidates.txt"
          # Stable / post releases may update "latest" + index; -dev etc. only when no stable latest exists.
          regexp="^([0-9.]+|[0-9.]+[.-]post[0-9]+)$"

          mkdir -p "$staging_root"
          : >"$candidates_file"

          # Only the integrations that were released in this workflow run.
          echo "$INTEGRATIONS_MATRIX" | jq -r '.[]' >file_list.txt
          echo "Uploading specs for released integrations only:"
          cat file_list.txt

          # Phase 1: stage specs/schemas locally only (no S3 writes yet).
          # Expensive docker work happens before the late index pull; uploads wait until
          # index.json is successfully fetched so a failed pull cannot leave orphans.
          while IFS= read -r file; do
              [[ -n "$file" ]] || continue

              integration_dir=$(dirname "$file")
              type=$(grep -E '^name = ".*"' "$integration_dir/../pyproject.toml" | cut -d'"' -f2)
              version=$(grep -E '^version = ".*"' "$integration_dir/../pyproject.toml" | cut -d'"' -f2)

              staging_dir="$staging_root/$type/$version"
              mkdir -p "$staging_dir"

              integration_spec="$staging_dir/spec.json"
              convert_spec_to_json "$file" "$temp_file"
              jq --arg type "$type" --arg version "$version" '. + {type: $type, version: $version}' "$temp_file" >"$integration_spec"

              has_schemas=false
              SCHEMA_CLI_COMMANDS=(
                docker run --platform linux/amd64 --rm
                  -v "$(pwd)/$staging_dir":/artifacts
                  "ghcr.io/port-labs/port-ocean-$type:$version"
                  sh -c "ocean port-app-config schema -o /artifacts/port_app_config.json && \
                          ocean port-app-config schema -f ui -o /artifacts/port_app_config.ui.json"
                )

              if "${SCHEMA_CLI_COMMANDS[@]}"; then
                  has_schemas=true
              else
                echo "::warning:: Docker port-app-config schema command failed for $type:$version, skipping schema upload to s3."
              fi

              printf '%s\t%s\t%s\t%s\t%s\n' "$type" "$version" "$staging_dir" "$integration_dir" "$has_schemas" >>"$candidates_file"
          done <file_list.txt

          # Phase 2: pull index.json late. Must succeed — never bootstrap from [] on a
          # partial release, or a missing/failed fetch would publish a truncated index.
          if ! aws s3 cp "s3://$aws_s3_bucket/$index_file" "$index_file"; then
              echo "::error:: Failed to fetch s3://$aws_s3_bucket/$index_file. Aborting to avoid overwriting the catalog with a partial index."
              exit 1
          fi
          echo "Successfully fetched global index file from s3 bucket (late pull)."

          # Phase 3: upload versioned + latest artifacts and patch index for released types only.
          # Versioned specs for all versions including -dev.
          # Stable index entries are not overwritten by -dev (see regexp above).
          # integ-service filters -dev from the catalog UI listing.
          while IFS=$'\t' read -r type version staging_dir integration_dir has_schemas; do
              [[ -n "$type" ]] || continue

              integration_folder="$type"
              version_folder="$integration_folder/$version"
              integration_spec="$staging_dir/spec.json"
              integration_spec_dest="$version_folder/spec.json"
              integration_latest_spec_dest="$integration_folder/spec.json"
              integration_latest_spec_legacy_dest="$type.json" # TODO: legacy support, remove once not in use
              port_app_config_schema="$staging_dir/port_app_config.json"
              port_app_config_ui_schema="$staging_dir/port_app_config.ui.json"
              port_app_config_schema_dest="$version_folder/port_app_config.json"
              port_app_config_ui_schema_dest="$version_folder/port_app_config.ui.json"
              port_app_config_schema_latest_dest="$integration_folder/port_app_config.json"
              port_app_config_ui_schema_latest_dest="$integration_folder/port_app_config.ui.json"
              static_examples_folder_dest="$integration_folder/examples/"

              aws s3 cp "$integration_spec" "s3://$aws_s3_bucket/$integration_spec_dest"
              echo "Successfully uploaded $integration_spec_dest to s3 bucket."

              if [ "$has_schemas" = true ]; then
                  aws s3 cp "$port_app_config_schema" "s3://$aws_s3_bucket/$port_app_config_schema_dest"
                  echo "Successfully uploaded $port_app_config_schema_dest to s3 bucket."
                  aws s3 cp "$port_app_config_ui_schema" "s3://$aws_s3_bucket/$port_app_config_ui_schema_dest"
                  echo "Successfully uploaded $port_app_config_ui_schema_dest to s3 bucket."
              fi

              latest_version=$(jq --arg type "$type" -r '.[] | select(.type == $type) | .version' "$index_file")

              should_release_latest_version=false
              if [[ ! "$latest_version" ]]; then
                  jq --argjson new_spec "[$(cat "$integration_spec")]" '. += $new_spec' "$index_file" >"$temp_file"
                  mv "$temp_file" "$index_file"
                  should_release_latest_version=true
              elif [[ ! "$latest_version" =~ $regexp ]] || [[ "$version" =~ $regexp ]]; then
                  jq --argjson updated_spec "$(cat "$integration_spec")" --arg type "$type" \
                      'map(if .type == $type then $updated_spec else . end)' "$index_file" >"$temp_file"
                  mv "$temp_file" "$index_file"
                  should_release_latest_version=true
              fi

              if [ "$should_release_latest_version" = true ]; then
                # Upload latest objects, then index immediately so a mid-loop failure cannot
                # leave newer latest pointers without a matching index entry.
                aws s3 cp "$integration_spec" "s3://$aws_s3_bucket/$integration_latest_spec_dest"
                echo "Successfully uploaded $integration_latest_spec_dest to s3 bucket."
                aws s3 cp "$integration_spec" "s3://$aws_s3_bucket/$integration_latest_spec_legacy_dest"
                echo "Successfully uploaded $integration_latest_spec_legacy_dest to s3 bucket."

                if [[ -d "$integration_dir/examples" ]]; then
                    aws s3 cp "$integration_dir/examples" "s3://$aws_s3_bucket/$static_examples_folder_dest" --recursive
                    echo "Successfully uploaded $type/examples/ to s3 bucket."
                fi

                if [ "$has_schemas" = true ]; then
                    aws s3 cp "$port_app_config_schema" "s3://$aws_s3_bucket/$port_app_config_schema_latest_dest"
                    echo "Successfully uploaded $port_app_config_schema_latest_dest to s3 bucket."
                    aws s3 cp "$port_app_config_ui_schema" "s3://$aws_s3_bucket/$port_app_config_ui_schema_latest_dest"
                    echo "Successfully uploaded $port_app_config_ui_schema_latest_dest to s3 bucket."
                fi

                aws s3 cp "$index_file" "s3://$aws_s3_bucket/$index_file"
                echo "Successfully uploaded $index_file to s3 bucket."
              fi
          done <"$candidates_file"

  notify-on-failure:
    runs-on: ubuntu-latest
    needs: [prepare-matrix, release-integration, upload-specs]
    if: ${{ always() && (needs.prepare-matrix.result == 'failure' || needs.release-integration.result == 'failure' || needs.upload-specs.result == 'failure') }}
    permissions: {}
    steps:
      - name: Send Slack notification
        continue-on-error: true
        uses: fjogeleit/http-request-action@v2
        with:
          url: ${{ secrets.OCEAN_SLACK_WEBHOOK }}
          method: 'POST'
          customHeaders: '{"Content-Type": "application/json"}'
          data: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Release integrations workflow failed* :x:"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Workflow run:* <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
                  }
                }
              ]
            }
